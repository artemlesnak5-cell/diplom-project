{% load shop_tags %}
<article class="watch-card"><a class="watch-photo" href="{{ product.get_absolute_url }}">{% if product.image %}<img src="{{ product.image.url }}" alt="{{ product.name }} — {{ product.color }}" width="600" height="600" loading="lazy">{% else %}<span class="no-photo">Фотография скоро появится</span>{% endif %}<span class="photo-tag">{% if product.stock %}В наличии{% else %}Нет в наличии{% endif %}</span></a><div class="watch-copy"><p class="reference">{{ product.reference }}</p><h3><a href="{{ product.get_absolute_url }}">{{ product.name }}</a></h3><p class="color">{{ product.color }}</p><div class="card-bottom"><strong>{{ product.price|rub }}</strong><a href="{{ product.get_absolute_url }}">Подробнее ↗</a></div></div></article>
